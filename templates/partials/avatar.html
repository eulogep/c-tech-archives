<span class="avatar avatar-{{ size|default:'md' }} tone-{{ person.username|tone_of }}">{% if person.has_profile_avatar %}<img src="{% url 'profile_avatar' person.pk %}" alt="{% if describe %}Photo de profil de {{ person.get_full_name|default:person.username }}{% endif %}" width="{% if size == 'xl' %}132{% elif size == 'lg' %}44{% else %}28{% endif %}" height="{% if size == 'xl' %}132{% elif size == 'lg' %}44{% else %}28{% endif %}" loading="lazy" decoding="async">{% else %}<span aria-hidden="true">{{ person.get_full_name|default:person.username|initials }}</span>{% endif %}</span>
